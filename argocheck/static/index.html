<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>argocheck</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/github-dark.min.css">
  <script>
    // Plugin registration queue (see argocheck.plugins / EXTENDING.md).
    // Order-independent: a plugin script can call this before or after
    // app.js has built the real registry and drained the queue.
    window.argocheckPlugin = function (fn) {
      if (window.__argocheckRegistry) fn(window.__argocheckRegistry);
      else (window.argocheckPluginQueue = window.argocheckPluginQueue || []).push(fn);
    };
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/static/vue.global.prod.js"></script>
  <script src="/static/js-yaml.min.js"></script>
  <script src="/static/highlight.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
