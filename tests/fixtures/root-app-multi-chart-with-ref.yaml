apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-chart-ref-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  sources:
    - repoURL: ./simple-chart
      targetRevision: HEAD
      helm:
        releaseName: chart-a
        valueFiles:
          - $sharedvals/overrides.yaml
    - repoURL: ./child-chart
      targetRevision: HEAD
      helm:
        releaseName: chart-b
    - repoURL: ./multisource-values
      targetRevision: HEAD
      ref: sharedvals
  project: default
