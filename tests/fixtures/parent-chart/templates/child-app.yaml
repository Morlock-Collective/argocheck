apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: ../child-chart
    targetRevision: HEAD
    helm:
      releaseName: child-release
      parameters:
        - name: replicaCount
          value: "{{ .Values.childReplicaCount }}"
  project: default
