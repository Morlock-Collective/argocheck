apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: ./simple-chart
    targetRevision: HEAD
    helm:
      releaseName: my-release
      parameters:
        - name: replicaCount
          value: "3"
  project: default
