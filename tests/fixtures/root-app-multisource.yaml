apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  sources:
    - repoURL: ./simple-chart
      targetRevision: HEAD
      helm:
        releaseName: multi-release
        valueFiles:
          - $extvals/overrides.yaml
    - repoURL: ./multisource-values
      targetRevision: HEAD
      ref: extvals
  project: default
