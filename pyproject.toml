[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "localargo"
version = "0.1.0"
description = "Local ArgoCD app-of-apps Helm validator and dry-runner"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
web = [
    "streamlit>=1.32",
]

[project.scripts]
localargo = "localargo.cli:main"
localargo-web = "localargo.web_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["localargo*"]
