[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argocheck"
version = "0.2.0"
description = "Local ArgoCD app-of-apps Helm validator and dry-runner"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jesper Lloyd", email = "jpl.lloyd@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click==8.5.0",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.urls]
Homepage = "https://github.com/Morlock-Collective/argocheck"
Repository = "https://github.com/Morlock-Collective/argocheck"
Issues = "https://github.com/Morlock-Collective/argocheck/issues"
Changelog = "https://github.com/Morlock-Collective/argocheck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
]

[project.scripts]
argocheck = "argocheck.cli:main"
argocheck-web = "argocheck.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["argocheck*"]

[tool.setuptools.package-data]
argocheck = ["static/*"]
