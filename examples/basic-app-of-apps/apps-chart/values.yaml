# The repository URL for this monorepo. All charts live as subdirectories here.
# Replace LOCALARGO_EXAMPLES_PATH with the absolute path to the basic-app-of-apps
# directory. See README.md for the one-liner that does this automatically.
repoBase: "file:///LOCALARGO_EXAMPLES_PATH"

guestbook:
  enabled: true
  targetRevision: HEAD
  namespace: default
  replicaCount: 2
  image:
    repository: gcr.io/heptio-images/ks-guestbook-demo
    tag: "0.2"

podinfo:
  enabled: true
  targetRevision: HEAD
  namespace: default
  replicaCount: 1
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: "6.7.0"
