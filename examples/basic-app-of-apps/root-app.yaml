apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: "file:///ARGOCHECK_EXAMPLES_PATH"
    path: apps-chart
    targetRevision: HEAD
    helm:
      releaseName: apps
  project: default
